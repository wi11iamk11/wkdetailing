[project]
name = "voice-line"
version = "1.0.0"
description = "Hands-free voice conversation with a warm Claude Agent SDK session"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sounddevice>=0.4.6",
    # webrtcvad-wheels, not webrtcvad: the original ships no prebuilt Windows
    # wheel, so `uv sync` tries to compile it and dies asking for the Visual
    # C++ build tools -- several GB of toolchain to install a voice activity
    # detector. This fork is the same library with the same `import webrtcvad`
    # module name, published with wheels for cp310 through cp313.
    "webrtcvad-wheels>=2.0.14",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "claude-agent-sdk>=0.2.0",
    "httpx>=0.27",
    "psutil>=5.9",
    # Kept for any platform that still falls back to a source build (the
    # wheels above cover cp310-cp313 on the usual architectures, not every
    # box): that build imports pkg_resources, which setuptools 81 removed.
    "setuptools<81",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.1; sys_platform == 'win32'",
]

[tool.uv]
# This is an app, not a library: do not try to build and install it.
package = false
